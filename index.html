
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trang Trại Bắt Thú</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>🌾 TRANG TRẠI BẮT THÚ 🐾</h1>

<div id="menu">
  <h2>Chọn con vật muốn bắt</h2>
  <select id="animal">
    <option value="0">🐰 Thỏ - Khó nhất</option>
    <option value="1">🦆 Vịt</option>
    <option value="2">🦃 Gà tây</option>
    <option value="3">🐄 Bò</option>
    <option value="4">🐑 Cừu</option>
    <option value="5">🐴 Ngựa</option>
    <option value="6">🐐 Dê</option>
    <option value="7">🐷 Lợn - Dễ nhất</option>
  </select>
  <br><br>
  <button onclick="startGame()">Bắt đầu chơi ▶</button>
</div>

<div id="game" hidden>
  <p id="info"></p>
  <div id="farm">
    <div id="barn">🏠</div>
    <div id="farmer">👨‍🌾</div>
    <div id="player">🧑‍🌾</div>
    <div id="animal">🐰</div>
    <div class="obstacle o1">🪵</div>
    <div class="obstacle o2">🌾</div>
    <div class="obstacle o3">🛢️</div>
  </div>
  <p>Di chuyển bằng các nút mũi tên. Đến gần con vật rồi nhấn BẮT!</p>
  <button onclick="setMode('quiet')">1. Đi chậm 🤫</button>
  <button onclick="setMode('fast')">2. Chạy nhanh 💨</button>
  <div class="controls">
    <button onclick="move(0,-1)">⬆️</button>
    <div>
      <button onclick="move(-1,0)">⬅️</button>
      <button onclick="move(0,1)">⬇️</button>
      <button onclick="move(1,0)">➡️</button>
    </div>
  </div>
  <button onclick="catchAnimal()">🐾 BẮT CON VẬT</button>
  <p id="message"></p>
</div>

<script src="script.js"></script>
</body>
</html>
